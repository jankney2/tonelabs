name = "tone-fyi-cand-jacob-ankney"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Static dashboard files. run_worker_first so Basic Auth covers them too.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
preview_urls = false

# Keep Ringsnitch data in sync. Needs Worker secrets RINGSNITCH_READKEY, RINGSNITCH_ACCOUNT_ID, DATABASE_URL.
[triggers]
crons = ["*/30 * * * *"]
