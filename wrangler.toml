name = "tone-fyi-cand-jacob-ankney"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Static dashboard files. run_worker_first so Basic Auth covers them too.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
preview_urls = false

# "*/30" keeps Ringsnitch data in sync (needs Worker secrets RINGSNITCH_READKEY, RINGSNITCH_ACCOUNT_ID, DATABASE_URL).
# "15 * * * *" links people and employees (needs only DATABASE_URL); IDENTITY_CRON in src/scheduled.js must match.
[triggers]
# "30 13 * * *" reads the Mostlyanswered daily files (needs MOSTLY_ANSWERED_URL, _USER, _PASS); MOSTLYANSWERED_CRON in src/scheduled.js must match.
crons = ["*/30 * * * *", "15 * * * *", "30 13 * * *"]
